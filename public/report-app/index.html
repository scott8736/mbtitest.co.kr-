.pil:nth-child(2) { border: .7mm solid var(--c); background: var(--cl); }
.pil small { display: block; font-size: 6.8pt; color: var(--sub); margin-bottom: 1.4mm; }
.pil b { display: block; font-family: "Gowun Batang", serif; font-size: 22pt; line-height: 1.15; }
.pil span { display: block; font-size: 7.4pt; color: var(--sub); margin-top: 1.2mm; }
.pil.none b { color: #cfc8bb; }
.els { display: grid; gap: 2.2mm; margin: 2mm 0 4mm; }
.el { display: grid; grid-template-columns: 14mm 1fr 6mm; gap: 2mm; align-items: center; }
.el span { font-size: 9pt; font-weight: 700; } .el small { font-size: 7pt; color: var(--sub); margin-left: 1mm; }
.el > div { height: 4.6mm; border-radius: 99px; background: #f0ebe2; overflow: hidden; }
.el i { display: block; height: 100%; border-radius: 99px; }
.el b { font-size: 8.4pt; text-align: right; }
.tg { display: flex; gap: 2mm; margin-top: auto; }
.tg span { flex: 1; text-align: center; padding: 2.4mm 0; border-radius: 2.6mm; background: #f4f1ea; font-size: 8.4pt; color: #a29a8c; font-weight: 700; }
.tg span.on { background: var(--c); color: #fff; }
.phone { position: relative; width: 62mm; height: 134mm; margin: 2mm auto 4mm; border-radius: 8mm; overflow: hidden; border: 2mm solid #22223a; box-shadow: 0 3mm 8mm rgba(0,0,0,.2); }
.phone img { width: 100%; height: 100%; object-fit: cover; }
.phone .clock { position: absolute; top: 10mm; left: 0; right: 0; text-align: center; color: #fff; font-size: 22pt; font-weight: 300; text-shadow: 0 .5mm 2mm rgba(0,0,0,.25); }
p.body.center { text-align: center; font-size: 8.2pt; }
.poster-mini { width: 84mm; margin: 2mm auto 0; padding: 6mm; background: #fffaf3; border: .4mm solid var(--c); text-align: center; box-shadow: 0 2mm 6mm rgba(0,0,0,.1); }
.poster-mini .img { height: 80mm; border-radius: 34mm 34mm 3mm 3mm; overflow: hidden; margin-bottom: 4mm; }
.poster-mini img { width: 100%; height: 100%; object-fit: cover; }
.poster-mini b { display: block; font-family: "Gowun Batang", serif; font-size: 14pt; }
.poster-mini span { font-size: 9pt; color: var(--cd); }
.tipline { margin-top: 2mm !important; font-size: 7.8pt !important; color: var(--sub) !important; }
.tipline b { color: var(--cd); font-size: 7pt; margin-right: 1mm; }
.wall img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.wall .foot { color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.35); }

/* ── 사이트 열람 화면(public/report-app) 전용 ── */
.label, .extras { display: none !important; }
.vbar { position: sticky; top: 0; z-index: 50; background: rgba(255,250,243,.96); border-bottom: 1px solid #e6dfd2; backdrop-filter: blur(6px); font-family: "Noto Sans KR", sans-serif; }
.vbar-in { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.vbar-in b { font-size: 15px; margin-right: auto; }
.vbar-in span { font-size: 13px; color: #6b6c80; }
.vbar-in button, .vbar-in a { padding: 8px 12px; border-radius: 99px; border: 1px solid var(--c); background: #fff; color: var(--cd); font: 600 13px "Noto Sans KR", sans-serif; text-decoration: none; cursor: pointer; }
.vbar-in button { background: var(--c); color: #fff; }
.vhelp { max-width: 760px; margin: 0 auto; padding: 0 16px 10px; font-size: 12px; color: #6b6c80; }
.vmsg { max-width: 560px; margin: 40px auto; padding: 0 16px; text-align: center; font: 15px/1.7 "Noto Sans KR", sans-serif; color: #45465a; }
.vmsg:empty { display: none; }
@media print { .vbar, .vmsg { display: none !important; } body { zoom: 1 !important; } }
</style>
</head>
<body>
<div class="vbar" id="vbar">
  <div class="vbar-in">
    <b>모리 마음숲 안내서</b>
    <span id="vorder"></span>
    <button type="button" id="vprint">PDF로 저장 · 인쇄</button>
    <a id="vw1" download>배경화면 1</a><a id="vw2" download>배경화면 2</a><a id="vw3" download>배경화면 3</a>
  </div>
  <p class="vhelp">휴대폰: 「PDF로 저장」을 누른 뒤 인쇄 화면에서 <b>PDF로 저장</b>을 고르세요. 이 주소와 주문번호를 함께 보관하면 언제든 다시 열 수 있어요.</p>
</div>
<div class="vmsg" id="vmsg">리포트를 불러오는 중이에요…</div>
<div class="book" id="book"></div>
<p class="label">— 따로 드리는 것: 휴대폰 배경화면 3종 · 액자용 포스터 —</p>
<div class="extras" id="extras"></div>
<script>
// 주문 열쇠(?o=)로 결제된 리포트를 받아 그린다. 원고는 이 파일에 없고 서버가 결제 확인 뒤에만 준다.
(function () {
  var msg = document.getElementById("vmsg");
  var token = new URLSearchParams(location.search).get("o") || "";
  if (!/^[0-9a-f]{64}$/.test(token)) { msg.textContent = "주소가 올바르지 않아요. 결제 완료 화면의 링크나 「주문 다시 찾기」로 열어 주세요."; return; }
  fetch("/api/report/book?o=" + token, { cache: "no-store" })
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (res) {
      if (!res.ok) { msg.textContent = res.j.error || "리포트를 불러오지 못했어요."; return; }
      var p = res.j.params;
      var q = new URLSearchParams();
      Object.keys(p).forEach(function (k) { if (p[k] !== "" && p[k] !== null && p[k] !== undefined) q.set(k, String(p[k])); });
      if (!p.birth) q.delete("bt");
      window.PARAMS = q.toString();
      window.BOOK = res.j.book;
      document.getElementById("vorder").textContent = "주문번호 " + res.j.orderNo;
      // 이 기기에 기억 — /report/find/ 의 「이 기기에서 연 리포트」(components/ReportDone.tsx 와 같은 열쇠 이름)
      try {
        var KEY = "mori-reports", list = JSON.parse(localStorage.getItem(KEY) || "[]");
        if (!Array.isArray(list)) list = [];
        list = [{ token: token, orderNo: res.j.orderNo, type: p.type, at: new Date().toISOString() }].concat(list.filter(function (r) { return r && r.token !== token; })).slice(0, 10);
        localStorage.setItem(KEY, JSON.stringify(list));
      } catch (e) { /* 기억 못 해도 휴대폰 번호로 찾을 수 있다 */ }
      ["1", "2", "3"].forEach(function (n) {
        var a = document.getElementById("vw" + n);
        a.href = "walls/" + p.type + "-" + n + ".jpg";
        a.setAttribute("download", "mori-" + p.type.toLowerCase() + "-wallpaper-" + n + ".jpg");
      });
      document.getElementById("vprint").onclick = function () { window.print(); };
      var s = document.createElement("script");
      s.src = "report_main.js";
      s.onload = function () {
        msg.textContent = "";
        // 화면이 좁으면 쪽 전체가 보이게 줄인다(인쇄에는 영향 없음)
        var fit = function () { var w = Math.min(1, (window.innerWidth - 16) / 580); document.getElementById("book").style.zoom = w; };
        fit(); window.addEventListener("resize", fit);
      };
      document.body.appendChild(s);
    })
    .catch(function () { msg.textContent = "리포트를 불러오지 못했어요. 잠시 뒤 새로고침해 주세요."; });
})();
</script>
</body>
</html>
